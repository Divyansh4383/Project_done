services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprintforge
      POSTGRES_USER: sprintforge
      POSTGRES_PASSWORD: sprintforge
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sprintforge
      JWT_SECRET: local-compose-secret-change-before-production-123
      CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      REDIS_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
